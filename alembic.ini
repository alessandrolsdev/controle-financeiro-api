# Arquivo: alembic.ini
# Configuração do Alembic. A URL de conexão NÃO fica aqui — ela é lida da
# variável de ambiente DATABASE_URL em alembic/env.py, para que credenciais
# nunca sejam versionadas.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timezone usado ao gerar o cabeçalho das migrações.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
